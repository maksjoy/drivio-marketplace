function headers(user=false){const h={apikey:KEY,"Content-Type":"application/json"};if(user&&session?.access_token)h.Authorization="Bearer "+session.access_token;return h}async function req(path,opt={}){const r=await fetch(URL+path,opt);let j=null;try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.msg||j?.message||j?.error_description||j?.error||("HTTP "+r.status));return j}

async function postCar(e){e.preventDefault();const b=$("post");b.disabled=true;b.textContent="Uploading…";let listingId=null,uploaded=[];try{const phone=$("sph").value.trim(),email=$("se").value.trim(),tg=$("stg").value.trim();if(!phone&&!email&&!tg)throw new Error("Add phone, email or Telegram.");const payload={user_id:session.user.id,seller_name:session.user.user_metadata?.display_name||session.user.email,seller_phone:phone||null,seller_email:email||null,seller_telegram:tg||null,make:$("sm").value,model:$("smo").value,year:+$("sy").value,price:+$("sp").value,mileage:+$("sk").value,fuel:$("sf").value,city:$("sc").value||null,description:$("sd").value||null,features:[],status:"active"};const listing=await req("/rest/v1/listings",{method:"POST",headers:{...headers(true),Prefer:"return=representation"},body:JSON.stringify(payload)});const l=listing[0];listingId=l.id;const fs=[...$("si").files];if(!fs.length||fs.length>8)throw new Error("Choose 1–8 photos.");const rows=[];for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>8*1024*1024)throw new Error("Each photo must be under 8 MB.");const ext=f.type==="image/png"?"png":f.type==="image/webp"?"webp":"jpg",path=session.user.id+"/"+l.id+"/"+crypto.randomUUID()+"."+ext;const r=await fetch(URL+"/storage/v1/object/listing-photos/"+path,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":f.type,"x-upsert":"false"},body:f});if(!r.ok){let x={};try{x=await r.json()}catch{}throw new Error(x.message||"Photo upload failed")}uploaded.push(path);rows.push({listing_id:l.id,storage_path:path,position:i})}await req("/rest/v1/listing_images",{method:"POST",headers:{...headers(true),Prefer:"return=minimal"},body:JSON.stringify(rows)});$("smsg").innerHTML='<div class="msg ok">Car published.</div>';setTimeout(()=>{closeM();load()},500)}catch(e){if(uploaded.length)try{await fetch(URL+"/storage/v1/object/listing-photos",{method:"DELETE",headers:headers(true),body:JSON.stringify({prefixes:uploaded})})}catch{};if(listingId)try{await req("/rest/v1/listings?id=eq."+listingId,{method:"DELETE",headers:headers(true)})}catch{};$("smsg").innerHTML='<div class="msg err">'+e.message+'</div>'}finally{b.disabled=false;b.textContent="Post car now"}}
async function reportListing(id){if(!session)return auth();const reason=prompt("Reason for report (scam, dealer, incorrect info, sold, other):");if(!reason)return;try{await req("/rest/v1/listing_reports",{method:"POST",headers:{...headers(true),Prefer:"return=minimal"},body:JSON.stringify({listing_id:id,reporter_id:session.user.id,reason:reason.slice(0,120)})});alert("Report submitted. Thank you.")}catch(e){alert(e.message.includes("duplicate")?"You already reported this listing.":e.message)}}
async function favorites(){if(!session)return auth();view="fav";await loadFavs();$("title").textContent="Favorites";const list=cars.filter(c=>favSet.has(c.id));$("count").textContent=list.length+" saved";render(list)}
async function account(){if(!session)return auth();await adminCheck();try{const d=await req("/rest/v1/listings?select=id,make,model,year,price,status&user_id=eq."+session.user.id+"&order=created_at.desc",{headers:headers(true)});show('<button class="close" onclick="closeM()">×</button><div class="modalbody"><h2>My account</h2><p><b>'+(session.user.user_metadata?.display_name||"User")+'</b><br>'+session.user.email+'</p><button class="primary" onclick="sell()">Post my car</button>'+(isAdmin?'<button class="secondary" onclick="adminPanel()">Admin panel</button>':'')+'<h3>My listings</h3>'+(d.length?d.map(x=>'<div class="row"><div><b>'+x.year+' '+x.make+' '+x.model+'</b><br><small>$'+Number(x.price).toLocaleString()+' · '+x.status+'</small></div><div><button class="secondary" onclick="markStatus(\''+x.id+'\',\'sold\')">Sold</button> <button class="secondary" onclick="markStatus(\''+x.id+'\',\'removed\')">Remove</button></div></div>').join(""):'<p>No listings yet.</p>')+'</div>')}catch(e){alert(e.message)}}
async function markStatus(id,status){try{await req("/rest/v1/listings?id=eq."+id,{method:"PATCH",headers:{...headers(true),Prefer:"return=minimal"},body:JSON.stringify({status})});account();load()}catch(e){alert(e.message)}}
async function adminPanel(){if(!isAdmin)return;try{const [reports,listings]=await Promise.all([req("/rest/v1/listing_reports?select=*&order=created_at.desc&limit=100",{headers:headers(true)}),req("/rest/v1/listings?select=id,make,model,year,status,seller_name&order=created_at.desc&limit=100",{headers:headers(true)})]);show('<button class="close" onclick="closeM()">×</button><div class="modalbody"><h2>Admin panel</h2><h3>Open reports</h3>'+(reports.filter(r=>r.status==="open").map(r=>'<div class="row"><div><b>'+r.reason+'</b><br><small>Listing '+r.listing_id+'</small></div><button class="secondary" onclick="reviewReport('+r.id+')">Reviewed</button></div>').join("")||'<p>No open reports.</p>')+'<h3>Latest listings</h3>'+listings.map(x=>'<div class="row"><div><b>'+x.year+' '+x.make+' '+x.model+'</b><br><small>'+x.seller_name+' · '+x.status+'</small></div><button class="danger" onclick="adminRemove(\''+x.id+'\')">Remove</button></div>').join("")+'</div>')}catch(e){alert(e.message)}}
async function reviewReport(id){try{await req("/rest/v1/listing_reports?id=eq."+id,{method:"PATCH",headers:{...headers(true),Prefer:"return=minimal"},body:JSON.stringify({status:"reviewed"})});adminPanel()}catch(e){alert(e.message)}}
async function adminRemove(id){if(!confirm("Remove this listing from public view?"))return;try{await req("/rest/v1/listings?id=eq."+id,{method:"PATCH",headers:{...headers(true),Prefer:"return=minimal"},body:JSON.stringify({status:"removed"})});adminPanel();load()}catch(e){alert(e.message)}}
function home(){load()}function nav(el){document.querySelectorAll(".mobile button").forEach(x=>x.classList.remove("active"));el.classList.add("active")}function show(h){$("modal").innerHTML=h;$("mbg").classList.add("show")}function closeM(){$("mbg").classList.remove("show")}
(async()=>{save(session);await refreshSession();await adminCheck();await load()})();
</script></body></html>
