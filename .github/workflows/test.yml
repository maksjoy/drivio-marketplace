name: Test Alberta-Cars Web

on:
  push:
    branches: [main, chore/production-launch-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs cancel each other; back-to-back pushes to main keep their CI/CDN smoke.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rjoipowznfokhvahuozf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_J9fxpOkaIxvgEsTJ2IwHrw_7exploAN
      # Only a presence flag at job level; the DB URL itself is scoped to the psql step.
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          # Browsers are baked into the e2e image. Do not download them on this runner.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Enforce web-only source tree
        run: |
          test ! -d production
          if grep -RniE 'telegram|t\.me/' app components lib middleware.ts 2>/dev/null; then
            echo 'Telegram reference found in canonical web source.'
            exit 1
          fi
          test ! -f lib/supabase/client.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build canonical Next.js app
        run: npm run build

      - name: Drop Next build cache from the artifact
        run: rm -rf .next/cache

      - name: Upload Next.js build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Live public security smoke
        run: npm run test:security-live

      - name: Database RLS/security SQL
        if: env.HAS_SUPABASE_DB_URL == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tests/database-security.sql

      - name: Explain optional DB SQL check
        if: env.HAS_SUPABASE_DB_URL != 'true'
        run: echo 'SUPABASE_DB_URL secret is not configured; live public boundary tests still run, but direct database-security.sql requires this CI secret.'

      - name: Read-only production data load smoke
        env:
          LOAD_REQUESTS: 60
          LOAD_CONCURRENCY: 6
          LOAD_P95_WARN_MS: 2500
          LOAD_P95_FAIL_MS: 5000
        run: npm run load:smoke

      - name: Production catalog CDN cache smoke
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          URL='https://p2pcars-alberta.vercel.app/api/catalog'
          curl -fsS -D /tmp/catalog-headers-first -o /tmp/catalog-first.json "$URL"
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            curl -fsS -D /tmp/catalog-headers-next -o /tmp/catalog-next.json "$URL"
            echo "CDN attempt $attempt"
            grep -iE '^(age|cache-control|x-vercel-cache):' /tmp/catalog-headers-next || true
            if grep -Eiq '^x-vercel-cache: (HIT|STALE)' /tmp/catalog-headers-next; then
              cmp /tmp/catalog-first.json /tmp/catalog-next.json
              exit 0
            fi
          done
          echo 'Production catalog did not produce a CDN HIT/STALE response.'
          exit 1

  e2e:
    name: e2e (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # mcr.microsoft.com/playwright:v1.63.0-noble
      # Index digest for the tag. linux/amd64 manifest: sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      # Node 24, git, and Playwright 1.63.0 browsers plus OS libraries are already in the image.
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=2g
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chromium 1/3
            artifact: chromium-1
            projects: desktop-chromium android-pixel-chromium android-small-chromium
            shard: 1/3
          - label: chromium 2/3
            artifact: chromium-2
            projects: desktop-chromium android-pixel-chromium android-small-chromium
            shard: 2/3
          - label: chromium 3/3
            artifact: chromium-3
            projects: desktop-chromium android-pixel-chromium android-small-chromium
            shard: 3/3
          - label: firefox key
            artifact: firefox-key
            projects: desktop-firefox
            shard: 1/1
          - label: webkit iphone key
            artifact: webkit-iphone-key
            projects: iphone-webkit iphone-small-webkit
            shard: 1/1
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rjoipowznfokhvahuozf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_J9fxpOkaIxvgEsTJ2IwHrw_7exploAN
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PW_BLOB_NAME: ${{ matrix.artifact }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download Next.js build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next

      - name: Check downloaded build
        run: test -f .next/BUILD_ID

      - name: Run Playwright tests
        shell: bash
        env:
          # Firefox in the container launches as root; avoid the runner-provided HOME owned by pwuser.
          HOME: /root
        run: |
          set -euo pipefail
          if [ "${RUN_AUTH_LIFECYCLE:-}" = "1" ]; then
            echo "Refusing to run the DB-writing authenticated lifecycle suite in this workflow."
            exit 1
          fi
          args=()
          for project in ${{ matrix.projects }}; do
            args+=(--project="$project")
          done
          npx playwright test "${args[@]}" --shard="${{ matrix.shard }}"

      - name: Fail if no Playwright tests ran
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f playwright-results.json || { echo 'playwright-results.json missing'; exit 1; }
          node -e '
            const s = require("./playwright-results.json").stats;
            const ran = s.expected + s.unexpected + s.flaky;
            console.log(`${process.env.LABEL}: ran=${ran} passed=${s.expected} failed=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`);
            if (ran === 0) { console.error("No Playwright tests ran in this job."); process.exit(1); }
          '
        env:
          LABEL: ${{ matrix.label }}

      - name: Upload Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-report-${{ matrix.artifact }}
          path: blob-report
          if-no-files-found: error
          retention-days: 7

  e2e-report:
    name: Merge Playwright HTML report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
