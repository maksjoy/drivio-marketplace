name: Test AlbertaCars

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rjoipowznfokhvahuozf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqb2lwb3d6bmZva2h2YWh1b3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTIyNzksImV4cCI6MjEwNDI4ODI3OX0.JWxDGnxMGZQRHXdhMIQ3raqMB4eAp9JYzdzSxl2TdF4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check production frontend
        run: node --check production/app.js

      - name: Test deployed production frontend
        run: npm run test:production

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test against real Supabase
        run: |
          set -o pipefail
          npm start > /tmp/albertacars.log 2>&1 &
          APP_PID=$!
          cleanup() {
            echo "===== SERVER LOG ====="
            cat /tmp/albertacars.log || true
            kill $APP_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..30}; do
            STATUS=$(curl -sS -o /tmp/home.html -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$STATUS" != "000" ]; then
              break
            fi
            sleep 1
          done

          echo "HOME_STATUS=$STATUS"
          cat /tmp/home.html || true
          test "$STATUS" = "200"
          grep -q "Used cars in Alberta" /tmp/home.html

          LOGIN_STATUS=$(curl -sS -o /tmp/login.html -w "%{http_code}" http://127.0.0.1:3000/login || true)
          echo "LOGIN_STATUS=$LOGIN_STATUS"
          test "$LOGIN_STATUS" = "200"

          SELL_STATUS=$(curl -sS -o /tmp/sell.html -w "%{http_code}" http://127.0.0.1:3000/sell || true)
          echo "SELL_STATUS=$SELL_STATUS"
          test "$SELL_STATUS" = "307"

          API_STATUS=$(curl -sS -o /tmp/api.json -w "%{http_code}" http://127.0.0.1:3000/api/listings || true)
          echo "API_STATUS=$API_STATUS"
          cat /tmp/api.json || true
          test "$API_STATUS" = "200"
