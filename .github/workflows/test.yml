name: Test P2PCars Web

on:
  push:
    branches: [main, chore/production-launch-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rjoipowznfokhvahuozf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_J9fxpOkaIxvgEsTJ2IwHrw_7exploAN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check web production frontend
        run: |
          node --check production/app.js
          node --check production/photos.js
          node --check production/ux-fixes.js

      - name: Test web production bundle
        run: npm run test:web-production

      - name: Live public security smoke
        run: npm run test:security-live

      - name: Typecheck
        run: npm run typecheck

      - name: Build legacy Next.js safety net
        run: npm run build

      - name: Smoke test legacy Next app against real Supabase
        run: |
          set -o pipefail
          npm start > /tmp/albertacars.log 2>&1 &
          APP_PID=$!
          cleanup() {
            echo "===== SERVER LOG ====="
            cat /tmp/albertacars.log || true
            kill $APP_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..30}; do
            STATUS=$(curl -sS -o /tmp/home.html -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$STATUS" != "000" ]; then break; fi
            sleep 1
          done

          test "$STATUS" = "200"
          grep -q "Used cars in Alberta" /tmp/home.html
          test "$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:3000/login)" = "200"
          test "$(curl -sS -o /tmp/sell.html -w '%{http_code}' http://127.0.0.1:3000/sell)" = "307"
          test "$(curl -sS -o /tmp/api.json -w '%{http_code}' http://127.0.0.1:3000/api/listings)" = "200"

      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit

      - name: iPhone WebKit E2E
        run: npm run test:e2e

      - name: Read-only production data load smoke
        env:
          LOAD_REQUESTS: 60
          LOAD_CONCURRENCY: 6
          LOAD_P95_WARN_MS: 2500
          LOAD_P95_FAIL_MS: 5000
        run: npm run load:smoke
